name: Build & Publish MediCar Plus (Windows)

# ============================================================================
# Simple y robusto · dispara en push de tag "v*" (como en v2.2.7 y anteriores).
# Flujo del usuario:
#   1. Save to Github (push normal de código)
#   2. Crear Release en GitHub con tag v2.3.X → PUBLISH
#   3. Este workflow compila el .exe y lo adjunta a la Release
#   4. El .exe del usuario se auto-actualiza al abrirlo.
# ============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: commercial/electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG"
          echo "package.json version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG no coincide con package.json ($PKG). Sube la versión en commercial/electron/package.json antes de crear la Release."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build & publish Windows installer + portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: MediCarPlus-Windows-${{ github.ref_name }}
          path: |
            commercial/electron/dist/*.exe
            commercial/electron/dist/latest.yml

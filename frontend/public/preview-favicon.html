<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Preview Favicon Millorat</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;padding:40px;text-align:center}
.grid{display:flex;gap:40px;justify-content:center;align-items:end;margin-top:30px}
.item{text-align:center}
.item img{background:#e2e8f0;padding:6px;border-radius:6px;image-rendering:auto}
.tab{display:inline-flex;align-items:center;gap:6px;background:#3f3f46;color:#f4f4f5;padding:7px 12px 7px 8px;border-radius:8px 8px 0 0;margin-top:14px}
.tab img{width:16px;height:16px}
h1{color:#f5b301}
p{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<h1>Nou favicon · més contrast a mides petites</h1>
<p>Ara la "M" dourada + badge "+" verd destaquen a qualsevol mida.</p>

<div class="grid">
  <div class="item">
    <img src="favicon-16.png" width="16">
    <div style="font-size:11px;color:#64748b;margin-top:6px">16px<br>pestanya real</div>
  </div>
  <div class="item">
    <img src="favicon-32.png" width="32">
    <div style="font-size:11px;color:#64748b;margin-top:6px">32px<br>retina</div>
  </div>
  <div class="item">
    <img src="favicon-48.png" width="48">
    <div style="font-size:11px;color:#64748b;margin-top:6px">48px<br>menú</div>
  </div>
  <div class="item">
    <img src="favicon-180.png" width="90">
    <div style="font-size:11px;color:#64748b;margin-top:6px">90px<br>preview</div>
  </div>
  <div class="item">
    <img src="favicon-256.png" width="140">
    <div style="font-size:11px;color:#64748b;margin-top:6px">140px<br>escriptori</div>
  </div>
</div>

<div style="margin-top:50px">
  <p style="color:#e2e8f0;font-weight:700">Simulació pestanya del navegador (16px real):</p>
  <div class="tab"><img src="favicon-16.png">MediCar Plus · Software para centros médicos</div>
</div>

</body>
</html>
